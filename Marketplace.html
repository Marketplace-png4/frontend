<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua Luxury Store - Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/history@5/umd/history.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-router@6/umd/react-router.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-router-dom@6/umd/react-router-dom.development.js"></script>
    <script>
        // Check if required libraries loaded
        if (typeof React === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 50px;"><h1>React Library Failed to Load</h1><p>Please check your internet connection and try again.</p></div>';
        } else if (typeof ReactDOM === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 50px;"><h1>ReactDOM Library Failed to Load</h1><p>Please check your internet connection and try again.</p></div>';
        } else if (typeof Babel === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 50px;"><h1>Babel Library Failed to Load</h1><p>Please check your internet connection and try again.</p></div>';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./responsive.css" />
    <style>
        @keyframes wave {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        body {
            font-family: serif;
        }
        .logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            object-position: center;
            display: block;
            background: transparent;
            border-radius: 50%;
            padding: 4px;
        }
        @media (max-width: 768px) {
           .logo img {
              width: 65px;
              height: 65px;
           }
        }
        body.theme-light .text-white { color: #000 !important; }
        body.theme-light .text-gray-300 { color: #222 !important; }
        body.theme-light .text-gray-400 { color: #333 !important; }
        body.theme-light .bg-gray-800,
        body.theme-light .bg-gray-900,
        body.theme-light .bg-\[\#0b0b0b\],
        body.theme-light .bg-\[\#111111\],
        body.theme-light .bg-\[\#222222\],
        body.theme-light .bg-\[\#222\] {
            background-color: #f8f8f8 !important;
            color: #000 !important;
        }
        body.theme-light .border-\[\#D4AF37\] { border-color: #D4AF37 !important; }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        console.log('Marketplace script loaded');

        const { useState, useEffect } = React;
        const { HashRouter, Routes, Route, useNavigate, useParams } = ReactRouterDOM;

        const loadApprovedProducts = () => {
            const stored = localStorage.getItem('jmpProducts');
            if (!stored) return [];
            try {
                const productList = JSON.parse(stored);
                return productList.filter((product) => product.status === 'Approved');
            } catch (err) {
                return [];
            }
        };

        const parsePrice = (price) => {
            if (typeof price === 'number') return price;
            return Number(String(price).replace(/[^0-9.]/g, '')) || 0;
        };

        // Currency configuration with exchange rates (relative to NGN)
        const currencies = [
            { code: 'NGN', symbol: '₦', name: 'Nigerian Naira', rate: 1 },
            { code: 'USD', symbol: '$', name: 'US Dollar', rate: 0.0012 },
            { code: 'EUR', symbol: '€', name: 'Euro', rate: 0.0011 },
            { code: 'GBP', symbol: '£', name: 'British Pound', rate: 0.00095 },
            { code: 'JPY', symbol: '¥', name: 'Japanese Yen', rate: 0.18 },
            { code: 'CAD', symbol: 'C$', name: 'Canadian Dollar', rate: 0.0017 },
            { code: 'AUD', symbol: 'A$', name: 'Australian Dollar', rate: 0.0018 },
            { code: 'CHF', symbol: 'CHF', name: 'Swiss Franc', rate: 0.001 },
            { code: 'INR', symbol: '₹', name: 'Indian Rupee', rate: 0.1 },
            { code: 'ZAR', symbol: 'R', name: 'South African Rand', rate: 0.022 },
        ];

        const getCurrencySymbol = (code) => {
            return currencies.find(c => c.code === code)?.symbol || '₦';
        };

        const convertCurrency = (amountInNGN, toCurrency = 'NGN') => {
            if (toCurrency === 'NGN') return amountInNGN;
            const toRate = currencies.find(c => c.code === toCurrency)?.rate || 1;
            return Math.round(amountInNGN * toRate);
        };

        const formatPrice = (value, currencyCode = 'NGN') => {
            const symbol = getCurrencySymbol(currencyCode);
            return symbol + value.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        };

        const applyTheme = (mode = 'dark') => {
            let resolved = mode;
            if (resolved === 'device') {
                try {
                    resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                } catch (e) {
                    resolved = 'dark';
                }
            }
            document.documentElement.setAttribute('data-theme', resolved);
            document.body.classList.toggle('theme-light', resolved === 'light');
            document.body.classList.toggle('theme-dark', resolved === 'dark');
            if (resolved === 'light') {
                document.body.style.background = '#ffffff';
                document.body.style.color = '#000000';
            } else {
                document.body.style.background = '#0b0b0b';
                document.body.style.color = '#ffffff';
            }
        };

        const displayPrice = (product, currencyCode = 'NGN') => {
            const base = parsePrice(product.price);
            const feePrice = Math.round(base * 1.10);
            const convertedPrice = convertCurrency(feePrice, currencyCode);
            return formatPrice(convertedPrice, currencyCode);
        };

        // Sound utility functions for notifications
        const playNotificationSound = (soundId, customSoundData) => {
            try {
                if (soundId === 'custom' && customSoundData) {
                    const audio = new Audio(customSoundData);
                    audio.play().catch((e) => console.log('Custom sound playback failed:', e));
                    return;
                }

                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (soundId === 'sound1') {
                    oscillator.frequency.value = 800;
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                } else if (soundId === 'sound2') {
                    oscillator.frequency.value = 600;
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    
                    const oscillator2 = audioContext.createOscillator();
                    oscillator2.connect(gainNode);
                    oscillator2.frequency.value = 900;
                    oscillator2.start(audioContext.currentTime + 0.35);
                    oscillator2.stop(audioContext.currentTime + 0.65);
                } else if (soundId === 'sound3') {
                    oscillator.frequency.value = 1000;
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                }
            } catch (e) {
                console.log('Sound playback not supported:', e);
            }
        };

        // Text-to-speech for admin notifications
        const speakNotification = (message) => {
            try {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(message);
                    utterance.rate = 1;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {
                console.log('Speech synthesis not supported:', e);
            }
        };

        // Trigger notification with sound/speech
        const triggerNotification = (type, isAdmin = false, userSettings = null) => {
            if (isAdmin) {
                const messages = {
                    newUser: 'new user just signed up',
                    productApproval: 'A product for approval is waiting for you',
                    newOrder: 'New order has been placed in your marketplace go check it now',
                    verification: 'A verification request is here be careful and go check it',
                    sellerRequest: 'A new worker want to join your team approve the seller product',
                };
                speakNotification(messages[type] || 'New notification');
            } else if (userSettings && userSettings.sound) {
                if (userSettings.useDeviceSound) {
                    try {
                        new Notification('Joshua Luxury Store', {
                            body: 'You have a new notification.',
                            icon: 'image/my-logo.png',
                        });
                    } catch (e) {
                        console.log('Notification dispatch failed:', e);
                    }
                } else if (userSettings.selectedSound === 'custom' && userSettings.customSoundData) {
                    playNotificationSound('custom', userSettings.customSoundData);
                } else if (userSettings.selectedSound) {
                    playNotificationSound(userSettings.selectedSound);
                }
            }
        };

        const productCategories = {
            'Electronics & Gadgets': ['Mobile phones', 'Tablets', 'Laptops', 'Cameras', 'Accessories'],
            'Home & Office': ['Appliances', 'Furniture', 'Décor', 'Tools'],
            'Fashion': ['Men’s Clothing', 'Women’s Clothing', 'Kids’ Clothing', 'Shoes', 'Bags', 'Watches'],
            'Beauty & Personal Care': ['Skincare', 'Makeup', 'Perfumes', 'Grooming Products'],
            'Baby, Kids & Toys': ['Diapers', 'Baby Food', 'Toys', 'Strollers', 'Clothing'],
            'Groceries': ['Food Staples', 'Beverages', 'Household Supplies'],
            'Health & Wellness': ['Supplements', 'Fitness Gear', 'Medical Supplies'],
            'Sports & Outdoor': ['Exercise Equipment', 'Bicycles', 'Camping Gear'],
            'Automobile': ['Car Accessories', 'Spare Parts', 'Tools'],
            'Books, Movies & Music': ['Educational Materials', 'Novels', 'CDs/DVDs'],
            'Gaming': ['Consoles', 'Video Games', 'Accessories'],
            'Other Services': ['Food', 'Graphics Design', 'Supplements']
        };

        const updateUserRecord = (updatedUser) => {
            const users = JSON.parse(localStorage.getItem('jmpUsers') || '[]');
            const index = users.findIndex(u => u.email === updatedUser.email);
            if (index !== -1) {
                users[index] = updatedUser;
                localStorage.setItem('jmpUsers', JSON.stringify(users));
            }
        };

        const getMessages = () => {
            const msgs = localStorage.getItem('jmpMessages');
            return msgs ? JSON.parse(msgs) : [];
        };

        const saveMessages = (messages) => {
            localStorage.setItem('jmpMessages', JSON.stringify(messages));
        };

        const getCart = (email) => {
            const stored = localStorage.getItem(`jmpCart_${email}`);
            return stored ? JSON.parse(stored) : [];
        };

        const saveCart = (email, cart) => {
            localStorage.setItem(`jmpCart_${email}`, JSON.stringify(cart));
        };

        const getWishlist = (email) => {
            const stored = localStorage.getItem(`jmpWishlist_${email}`);
            return stored ? JSON.parse(stored) : [];
        };

        const getUserByEmail = (email) => {
            const users = JSON.parse(localStorage.getItem('jmpUsers') || '[]');
            return users.find(user => user.email === email);
        };

        const generateOrderId = () => {
            const digits = Math.floor(1000000 + Math.random() * 9000000);
            return `JLS${digits}YI`;
        };

        const saveWishlist = (email, favorites) => {
            localStorage.setItem(`jmpWishlist_${email}`, JSON.stringify(favorites));
        };

        // Product feedback (ratings & comments)
        const getProductFeedback = (productId) => {
            const stored = localStorage.getItem(`jmpProductFeedback_${productId}`);
            return stored ? JSON.parse(stored) : [];
        };

        const saveProductFeedback = (productId, feedbacks) => {
            localStorage.setItem(`jmpProductFeedback_${productId}`, JSON.stringify(feedbacks));
        };

        const Dashboard = ({ globalCurrency, setGlobalCurrency, globalThemeMode, setGlobalThemeMode }) => {
            console.log('Dashboard component rendering');
            const navigate = useNavigate();
            const [currentUser, setCurrentUser] = useState(null);
            const [currency, setCurrency] = useState(globalCurrency || 'NGN');
            const [themeMode, setThemeMode] = useState(globalThemeMode || 'dark');
            const [userProducts, setUserProducts] = useState([]);
            const [showAddProduct, setShowAddProduct] = useState(false);
            const [formData, setFormData] = useState({ title: '', description: '', price: '', category: '', subcategory: '', images: [], additionalDetails: '' });
            const [orders, setOrders] = useState([]);
            const [messages, setMessages] = useState([]);
            const [notificationPopup, setNotificationPopup] = useState(null);
            const [lastMessageId, setLastMessageId] = useState(null);
            const unreadCount = messages.filter(msg => !msg.read).length;
            const [showOrderHistory, setShowOrderHistory] = useState(false);
            const [profileData, setProfileData] = useState({});
            const [allProducts, setAllProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');
            const [selectedSubcategory, setSelectedSubcategory] = useState('');
            const [showFilterPanel, setShowFilterPanel] = useState(false);
            const [filterCategorySearch, setFilterCategorySearch] = useState('');
            const [priceRange, setPriceRange] = useState({ min: '', max: '' });
            const [selectedProductDetail, setSelectedProductDetail] = useState(null);
            const [selectedProductImageIndex, setSelectedProductImageIndex] = useState(0);
            const [productFeedbacks, setProductFeedbacks] = useState([]);
            const [feedbackRating, setFeedbackRating] = useState(5);
            const [feedbackComment, setFeedbackComment] = useState('');
            const isRestricted = currentUser?.status === 'Banned';
            const restrictedAlert = () => {
                alert('Your account is temporarily restricted. Contact Help & Support for details.');
            };

            useEffect(() => {
                setCurrency(globalCurrency || 'NGN');
            }, [globalCurrency]);

            useEffect(() => {
                setThemeMode(globalThemeMode || 'dark');
            }, [globalThemeMode]);

            useEffect(() => {
                try {
                    const user = localStorage.getItem('jmpCurrentUser');
                    if (user) {
                        const userData = JSON.parse(user);
                        setCurrentUser(userData);
                        setProfileData(userData);
                        loadUserProducts(userData.email);
                        loadMessages(userData.email);
                        loadOrders(userData.email);
                        loadAllProducts();
                        loadCart(userData.email);
                        loadFavorites(userData.email);
                        
                        // Load user settings
                        const settings = JSON.parse(localStorage.getItem(`jmpSettings_${userData.email}`) || '{}');
                        setCurrency(settings.currency || 'NGN');
                        setThemeMode(settings.themeMode || 'dark');
                        applyTheme(settings.themeMode || 'dark');
                        
                        // Request notification permission
                        if ('Notification' in window && Notification.permission === 'default') {
                            Notification.requestPermission();
                        }
                        
                        setLoading(false);
                    } else {
                        // If no user is logged in, redirect to login
                        window.location.href = './index.html#/login';
                        return;
                    }
                } catch (error) {
                    console.error('Error loading user data:', error);
                    // If there's an error, redirect to login
                    window.location.href = './index.html#/login';
                    return;
                }

                const handleCurrencyChange = (event) => {
                    if (event?.detail?.currency) {
                        setCurrency(event.detail.currency);
                    }
                };

                const handleThemeModeChange = (event) => {
                    if (event?.detail?.themeMode) {
                        setThemeMode(event.detail.themeMode);
                        applyTheme(event.detail.themeMode);
                    }
                };

                const handleSettingsStorage = (event) => {
                    const user = localStorage.getItem('jmpCurrentUser');
                    if (!user) return;
                    const userData = JSON.parse(user);
                    if (event.key === `jmpSettings_${userData.email}`) {
                        const settings = JSON.parse(event.newValue || '{}');
                        setCurrency(settings.currency || 'NGN');
                        setThemeMode(settings.themeMode || 'dark');
                        applyTheme(settings.themeMode || 'dark');
                    }
                };

                window.addEventListener('currencyChanged', handleCurrencyChange);
                window.addEventListener('themeModeChanged', handleThemeModeChange);
                window.addEventListener('storage', handleSettingsStorage);
                return () => {
                    window.removeEventListener('currencyChanged', handleCurrencyChange);
                    window.removeEventListener('themeModeChanged', handleThemeModeChange);
                    window.removeEventListener('storage', handleSettingsStorage);
                };
            }, []);

            const loadUserProducts = (email) => {
                const products = localStorage.getItem('jmpProducts');
                if (products) {
                    const productList = JSON.parse(products);
                    const userProds = productList.filter(p => p.userEmail === email);
                    setUserProducts(userProds);
                }
            };

            const loadMessages = (email) => {
                const msgs = localStorage.getItem('jmpMessages');
                if (msgs) {
                    const msgList = JSON.parse(msgs);
                    const userMsgs = msgList
                        .filter(m => m.recipientEmail === email)
                        .map(m => ({ ...m, read: m.read ?? true }))
                        .sort((a, b) => parseFloat(a.id) - parseFloat(b.id));
                    setMessages(userMsgs);
                    const latest = userMsgs[userMsgs.length - 1];
                    if (latest) {
                        setLastMessageId(latest.id);
                    }
                }
            };

            const openBrowserNotification = (message) => {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'granted') {
                    try {
                        new Notification(message.title, { body: message.content });
                    } catch (error) {
                        console.error('Browser notification failed:', error);
                    }
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            try {
                                new Notification(message.title, { body: message.content });
                            } catch (error) {
                                console.error('Browser notification failed:', error);
                            }
                        }
                    });
                }
            };

            const showMessageNotification = (message) => {
                if (!message) return;
                setNotificationPopup(message);
                openBrowserNotification(message);
                
                // Trigger sound notification for regular users
                if (currentUser && currentUser.accountType !== 'admin') {
                    try {
                        const settings = JSON.parse(localStorage.getItem(`jmpSettings_${currentUser.email}`) || '{}');
                        if (settings.notifications && settings.notifications.sound) {
                            triggerNotification('message', false, settings.notifications);
                        }
                    } catch (e) {
                        console.log('Error getting notification settings:', e);
                    }
                }
                
                window.setTimeout(() => setNotificationPopup(null), 6000);
            };

            useEffect(() => {
                const handleStorage = (event) => {
                    if (event.key !== 'jmpMessages' || !currentUser) return;
                    try {
                        const msgList = JSON.parse(event.newValue || '[]');
                        const userMsgs = msgList
                            .filter(m => m.recipientEmail === currentUser.email)
                            .map(m => ({ ...m, read: m.read ?? true }))
                            .sort((a, b) => parseFloat(a.id) - parseFloat(b.id));
                        setMessages(userMsgs);
                        const latest = userMsgs[userMsgs.length - 1];
                        if (latest && latest.id !== lastMessageId) {
                            setLastMessageId(latest.id);
                            showMessageNotification(latest);
                        }
                    } catch (error) {
                        console.error('Error parsing messages from storage event:', error);
                    }
                };

                window.addEventListener('storage', handleStorage);
                return () => window.removeEventListener('storage', handleStorage);
            }, [currentUser, lastMessageId]);

            const loadOrders = (email) => {
                const stored = localStorage.getItem('jmpOrders');
                if (stored) {
                    const allOrders = JSON.parse(stored);
                    const userOrders = allOrders.filter(o => o.buyerEmail === email);
                    setOrders(userOrders);
                }
            };

            const loadCart = (email) => {
                setCart(getCart(email));
            };

            const loadAllProducts = () => {
                const products = localStorage.getItem('jmpProducts');
                if (products) {
                    const productList = JSON.parse(products);
                    const approved = productList.filter(p => p.status === 'Approved');
                    setAllProducts(approved);
                    return;
                }

                // Create a test product if no products exist
                const testProduct = {
                    id: Date.now().toString(),
                    title: 'Premium Gold Luxury Watch',
                    description: 'Elegant Swiss-inspired luxury watch with premium materials and precision craftsmanship.',
                    price: 95000,
                    category: 'Fashion',
                    subcategory: 'Watches',
                    status: 'Approved',
                    userEmail: 'admin@joshua.com',
                    userName: 'Joshua Admin',
                    rating: '4.8',
                    images: ['https://via.placeholder.com/400x400?text=Luxury+Watch'],
                    createdAt: new Date().toISOString().split('T')[0]
                };
            const productList = [testProduct];
            localStorage.setItem('jmpProducts', JSON.stringify(productList));
            const approved = productList.filter(p => p.status === 'Approved');
            setAllProducts(approved);
            };

            const loadFavorites = (email) => {
                setFavorites(getWishlist(email));
            };

            const clearFilters = () => {
                setSelectedCategory('');
                setSelectedSubcategory('');
                setFilterCategorySearch('');
                setPriceRange({ min: '', max: '' });
            };

            const filteredProducts = allProducts.filter((product) => {
                const title = (product.title || '').toLowerCase();
                const description = (product.description || '').toLowerCase();
                const category = (product.category || '').toLowerCase();
                const subcategory = (product.subcategory || '').toLowerCase();
                const query = searchQuery.toLowerCase();
                const minPrice = parsePrice(priceRange.min);
                const maxPrice = parsePrice(priceRange.max);
                const productPrice = parsePrice(product.price);

                if (query && !(title.includes(query) || description.includes(query) || category.includes(query) || subcategory.includes(query))) {
                    return false;
                }
                if (selectedCategory && category !== selectedCategory.toLowerCase()) {
                    return false;
                }
                if (selectedSubcategory && subcategory !== selectedSubcategory.toLowerCase()) {
                    return false;
                }
                if (minPrice && productPrice < minPrice) {
                    return false;
                }
                if (maxPrice && productPrice > maxPrice) {
                    return false;
                }
                return true;
            });

            const availableCategories = Object.keys(productCategories).filter(category => category.toLowerCase().includes(filterCategorySearch.toLowerCase()));

            const currentSubcategories = selectedCategory ? productCategories[selectedCategory] || [] : [];

            const addToCart = (product) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                if (!currentUser) {
                    alert('Please login to add to cart.');
                    window.location.href = './index.html#/login';
                    return;
                }
                if (product.userEmail === currentUser.email) {
                    alert('You cannot add your own product to cart.');
                    return;
                }
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    alert('Product already in cart.');
                    return;
                }
                const newCart = [...cart, { ...product, quantity: 1 }];
                setCart(newCart);
                saveCart(currentUser.email, newCart);
                alert('Added to cart!');
            };

            const submitProductFeedback = (productId) => {
                if (!currentUser) {
                    alert('Please login to leave a review');
                    window.location.href = './index.html#/login';
                    return;
                }
                const feedbacks = getProductFeedback(productId);
                feedbacks.push({
                    id: Date.now().toString(),
                    rating: feedbackRating,
                    comment: feedbackComment,
                    userEmail: currentUser.email,
                    userName: `${currentUser.firstName || currentUser.email}`,
                    date: new Date().toISOString()
                });
                saveProductFeedback(productId, feedbacks);
                setProductFeedbacks(feedbacks);
                setFeedbackRating(5);
                setFeedbackComment('');
                alert('Thanks for your review!');
            };

            const removeFromCart = (productId) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                const newCart = cart.filter(item => item.id !== productId);
                setCart(newCart);
                saveCart(currentUser.email, newCart);
            };

            const toggleFavorite = (product) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                if (!currentUser) {
                    alert('Please login to add to wishlist.');
                    window.location.href = './index.html#/login';
                    return;
                }
                const isFav = favorites.some(fav => fav.id === product.id);
                let newFavorites;
                if (isFav) {

                                )}

                                <div>
                                    <h2 className="text-2xl font-bold text-[#D4AF37] mb-6">Browse All Products</h2>
                                    {filteredProducts.length > 0 ? (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                            {filteredProducts.map((product) => {
                                                const isOwner = product.userEmail === currentUser.email;
                                                const isPaused = product.paused;
                                                return (
                                                    <div key={product.id} className="rounded-3xl overflow-hidden border border-[#D4AF37] bg-[#111111] shadow-xl flex flex-col cursor-pointer transition-transform hover:-translate-y-1" onClick={() => navigate('/product/' + product.id)}>
                                                        <div className="h-48 bg-gray-800 flex items-center justify-center relative">
                                                            {product.images && product.images.length > 0 ? (
                                                                <img src={product.images[0]} alt={product.title} className="w-full h-full object-cover" />

                                                            {isPaused && (

                                                            <p className="text-2xl font-bold text-[#D4AF37] mb-4">{displayPrice(product, currency)}</p>

                                        </div>
                                    ) : (

                                            <p className="text-gray-400 text-sm">Try clearing filters or adjusting your search.</p>

                        ) : (
                            <div className="text-center py-20">
                                <h1 className="text-4xl font-bold text-[#D4AF37] mb-4">Access Restricted</h1>
                                <p className="text-gray-300 mb-8">You need to sign up or log in to access the marketplace.</p>
                                <button
                                    onClick={() => window.location.href = './index.html#/signup'}
                                    className="bg-[#D4AF37] text-black px-8 py-3 rounded-full font-semibold hover:bg-opacity-80 transition-colors"
                                >
                                    Sign Up Now
                                </button>
                            </div>
                        )}
                    </div>
                        </>
                    )}
                </div>
            );
        };

        const Cart = ({ currency }) => {
            const navigate = useNavigate();
            const [currentUser, setCurrentUser] = useState(null);
            const [cart, setCart] = useState([]);
            const [localCurrency, setLocalCurrency] = useState(currency || 'NGN');
            const isRestricted = currentUser?.status === 'Banned';
            const restrictedAlert = () => {
                alert('Your account is temporarily restricted. Contact Help & Support for details. Buying, posting, and marketplace actions are disabled.');
            };

            useEffect(() => {
                setLocalCurrency(currency || 'NGN');
            }, [currency]);

            useEffect(() => {
                const user = localStorage.getItem('jmpCurrentUser');
                if (user) {
                    const userData = JSON.parse(user);
                    setCurrentUser(userData);
                    setCart(getCart(userData.email));
                    
                    // Load currency if not passed
                    if (!currency) {
                        const settings = JSON.parse(localStorage.getItem(`jmpSettings_${userData.email}`) || '{}');
                        setLocalCurrency(settings.currency || 'NGN');
                    }
                } else {
                    navigate('/');
                }
            }, []);

            const updateQuantity = (productId, newQuantity) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                if (newQuantity < 1) return; // Minimum 1
                const newCart = cart.map(item =>
                    item.id === productId ? { ...item, quantity: newQuantity } : item
                );
                setCart(newCart);
                saveCart(currentUser.email, newCart);
            };

            const [touchStartPositions, setTouchStartPositions] = useState({});

            const removeFromCart = (productId) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                const newCart = cart.filter(item => item.id !== productId);
                setCart(newCart);
                saveCart(currentUser.email, newCart);
            };

            const addToWishlist = (product) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                const wish = getWishlist(currentUser.email);
                const exists = wish.some(fav => fav.id === product.id);
                if (!exists) {
                    const newWishlist = [...wish, product];
                    saveWishlist(currentUser.email, newWishlist);
                }
                removeFromCart(product.id);
                alert('Moved item to wishlist');
            };

            const handleCartTouchStart = (itemId, e) => {
                const touch = e.touches[0];
                setTouchStartPositions(prev => ({ ...prev, [itemId]: { x: touch.clientX, y: touch.clientY } }));
            };

            const handleCartTouchEnd = (item, e) => {
                const touch = e.changedTouches[0];
                const start = touchStartPositions[item.id];
                if (!start) return;
                const deltaX = touch.clientX - start.x;
                const deltaY = touch.clientY - start.y;
                const threshold = 60;
                if (Math.abs(deltaX) > threshold && Math.abs(deltaY) < 80) {
                    if (deltaX > 0) {
                        removeFromCart(item.id);
                    } else {
                        addToWishlist(item);
                    }
                }
                setTouchStartPositions(prev => {
                    const next = { ...prev };
                    delete next[item.id];
                    return next;
                });
            };

            const deliveryFee = 500;
            const itemsTotal = cart.reduce((sum, item) => sum + parsePrice(item.price) * 1.1 * item.quantity, 0);
            const total = itemsTotal + (cart.length > 0 ? deliveryFee : 0);

            const placeOrder = () => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                if (cart.length === 0) {
                    alert('Cart is empty.');
                    return;
                }
                const orderId = generateOrderId();
                const newOrder = {
                    id: orderId,
                    buyerEmail: currentUser.email,
                    buyerName: `${currentUser.firstName} ${currentUser.lastName}`,
                    products: cart,
                    totalAmount: total,
                    status: 'Ordered',
                    orderDate: new Date().toISOString(),
                    pickupDate: null
                };

                const stored = localStorage.getItem('jmpOrders');
                const allOrders = stored ? JSON.parse(stored) : [];
                allOrders.push(newOrder);
                localStorage.setItem('jmpOrders', JSON.stringify(allOrders));

                // Send messages to sellers
                const messages = JSON.parse(localStorage.getItem('jmpMessages') || '[]');
                cart.forEach(product => {
                    messages.push({
                        id: Date.now().toString() + Math.random(),
                        recipientEmail: product.userEmail,
                        title: 'New Order Received',
                        content: `New order ${orderId}: "${product.title}" has been placed. Drop the product at New yidi road, yinolu pharmacy, irewolede ilorin kwara state within 24 to 72 hours. Contact: 07070252673 for road direction.`,
                        productImage: product.images && product.images.length > 0 ? product.images[0] : null,
                        productTitle: product.title,
                        productDescription: product.description,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                });
                messages.push({
                    id: Date.now().toString() + Math.random(),
                    recipientEmail: currentUser.email,
                    title: 'Order Placed',
                    content: `Your order ${orderId} has been placed successfully. You will be notified when the order status changes.`,
                    orderId,
                    time: new Date().toLocaleString(),
                    read: false
                });
                localStorage.setItem('jmpMessages', JSON.stringify(messages));

                // Clear cart
                setCart([]);
                saveCart(currentUser.email, []);

                alert('Order placed successfully! You will be notified when ready for pickup.');
                navigate('/');
            };

            return (
                <div className="min-h-screen bg-[#0b0b0b] text-white px-4 py-10">
                    <div className="max-w-4xl mx-auto">
                        <div className="mb-10 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                            <div>
                                <h1 className="text-4xl md:text-5xl font-bold text-[#D4AF37]">Shopping Cart</h1>
                                <p className="text-gray-300 mt-2">{cart.length} item{cart.length !== 1 ? 's' : ''} in your cart</p>
                            </div>
                            <button
                                onClick={() => navigate('/')}
                                className="inline-flex items-center gap-2 border border-[#D4AF37] text-[#D4AF37] px-5 py-3 rounded-full font-semibold hover:bg-[#D4AF37] hover:text-black transition-colors"
                            >
                                Continue Shopping
                            </button>
                        </div>
                        {cart.length > 0 ? (
                            <div className="space-y-6">
                                {cart.map((item) => (
                                    <div
                                        key={item.id}
                                        className="bg-[#111111] border border-[#D4AF37] rounded-3xl p-6 flex flex-col gap-6 md:flex-row"
                                        onTouchStart={(e) => handleCartTouchStart(item.id, e)}
                                        onTouchEnd={(e) => handleCartTouchEnd(item, e)}
                                    >
                                        <div className="w-full md:w-24 h-24 bg-gray-800 rounded-lg flex items-center justify-center flex-shrink-0">
                                            {item.images && item.images.length > 0 ? (
                                                <img src={item.images[0]} alt={item.title} className="w-full h-full object-cover rounded-lg" />
                                            ) : (
                                                <span className="text-2xl">📦</span>
                                            )}
                                        </div>
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-white mb-2">{item.title}</h3>
                                            <p className="text-gray-300 text-sm mb-4">{item.description}</p>
                                            <p className="text-[#D4AF37] font-bold mb-4">{displayPrice(item, localCurrency)}</p>
                                            <div className="flex items-center gap-3 mb-4">
                                                <button
                                                    onClick={() => updateQuantity(item.id, (item.quantity || 1) - 1)}
                                                    className="w-10 h-10 rounded-full bg-[#1f1f1f] border border-[#D4AF37] text-[#D4AF37] text-2xl font-bold hover:bg-[#2a2a2a] transition-colors"
                                                >
                                                    -
                                                </button>
                                                <span className="min-w-[48px] text-center text-lg font-semibold text-white">{item.quantity || 1}</span>
                                                <button
                                                    onClick={() => updateQuantity(item.id, (item.quantity || 1) + 1)}
                                                    className="w-10 h-10 rounded-full bg-[#D4AF37] text-black text-2xl font-bold hover:bg-opacity-80 transition-colors"
                                                >
                                                    +
                                                </button>
                                            </div>
                                        </div>
                                        <div className="flex items-start justify-between md:flex-col md:items-end gap-4">
                                            <button
                                                onClick={() => removeFromCart(item.id)}
                                                className="text-red-500 hover:text-red-400 px-3 py-1 rounded"
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                <div className="bg-[#111111] border border-[#D4AF37] rounded-3xl p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-2xl font-bold text-white">Total:</span>
                                        <span className="text-3xl font-bold text-[#D4AF37]">{formatPrice(convertCurrency(Math.round(total), localCurrency), localCurrency)}</span>
                                    </div>
                                    <button
                                        onClick={placeOrder}
                                        className="w-full bg-[#D4AF37] text-black py-4 rounded-3xl font-semibold hover:bg-opacity-80 transition-colors"
                                    >
                                        Place Order
                                    </button>
                                </div>

                setLocalCurrency(currency || 'NGN');

                if (user) {
                    const userData = JSON.parse(user);
                    setCurrentUser(userData);
                    setFavorites(getWishlist(userData.email));

                        const settings = JSON.parse(localStorage.getItem(`jmpSettings_${userData.email}`) || '{}');

                } else {
                    navigate('/');

            const [touchStartPositions, setTouchStartPositions] = useState({});

            const removeFromFavorites = (productId) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;
                }
                const newFavorites = favorites.filter(fav => fav.id !== productId);
                setFavorites(newFavorites);
                saveWishlist(currentUser.email, newFavorites);
            };

            const addToCart = (product) => {
                if (isRestricted) {
                    restrictedAlert();
                    return;

                if (product.userEmail === currentUser.email) {
                    alert('You cannot add your own product to cart.');
                    return;

                const cart = getCart(currentUser.email);
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    alert('Product already in cart.');
                    return;

                const newCart = [...cart, { ...product, quantity: 1 }];
                saveCart(currentUser.email, newCart);
                removeFromFavorites(product.id);

                const touch = e.touches[0];
                setTouchStartPositions(prev => ({ ...prev, [productId]: { x: touch.clientX, y: touch.clientY } }));
            };

            const handleFavoriteTouchEnd = (product, e) => {
                const touch = e.changedTouches[0];
                const start = touchStartPositions[product.id];
                if (!start) return;
                const deltaX = touch.clientX - start.x;
                const deltaY = touch.clientY - start.y;
                const threshold = 60;
                if (Math.abs(deltaX) > threshold && Math.abs(deltaY) < 80) {
                    if (deltaX > 0) {
                        removeFromFavorites(product.id);
                    } else {
                        addToCart(product);

                setTouchStartPositions(prev => {
                    const next = { ...prev };

                    return next;

                                    </div>
                                    <div>
                                        <h4 className="text-lg font-semibold text-white mb-2">Urgent</h4>
                                        <a
                                            href="tel:09151888340"
                                            className="inline-block bg-[#D4AF37] text-black px-4 py-2 rounded-full font-semibold hover:bg-opacity-80 transition-colors"
                                        >
                                            Call Now
                                        </a>
                                    </div>
                                </div>
                                <p className="text-gray-300">Support available during working days, response within 24 hours.</p>
                            </div>
                        )}
                    </div>
                </footer>
            );
        };

        const App = () => {
            console.log('App component rendering');
            const [globalCurrency, setGlobalCurrency] = useState('NGN');
            const [globalThemeMode, setGlobalThemeMode] = useState('dark');

            useEffect(() => {
                const handleCurrencyChange = (event) => {
                    if (event?.detail?.currency) {
                        setGlobalCurrency(event.detail.currency);
                    }
                };

                const handleThemeModeChange = (event) => {
                    if (event?.detail?.themeMode) {
                        setGlobalThemeMode(event.detail.themeMode);
                    }
                };

                const handleSettingsStorage = (event) => {
                    const user = localStorage.getItem('jmpCurrentUser');
                    if (!user) return;
                    const userData = JSON.parse(user);
                    if (event.key === `jmpSettings_${userData.email}`) {
                        const settings = JSON.parse(event.newValue || '{}');
                        setGlobalCurrency(settings.currency || 'NGN');
                        setGlobalThemeMode(settings.themeMode || 'dark');
                    }
                };

                window.addEventListener('currencyChanged', handleCurrencyChange);
                window.addEventListener('themeModeChanged', handleThemeModeChange);
                window.addEventListener('storage', handleSettingsStorage);
                return () => {
                    window.removeEventListener('currencyChanged', handleCurrencyChange);
                    window.removeEventListener('themeModeChanged', handleThemeModeChange);
                    window.removeEventListener('storage', handleSettingsStorage);
                };
            }, []);

            return (
                <HashRouter>
                    <div className="min-h-screen flex flex-col">
                        <div className="flex-grow">
                            <Routes>
                                <Route path="/" element={<Dashboard globalCurrency={globalCurrency} setGlobalCurrency={setGlobalCurrency} globalThemeMode={globalThemeMode} setGlobalThemeMode={setGlobalThemeMode} />} />
                                <Route path="/product/:id" element={<ProductDetails currency={globalCurrency} themeMode={globalThemeMode} />} />
                                <Route path="/cart" element={<Cart currency={globalCurrency} />} />
                                <Route path="/wishlist" element={<Favorites currency={globalCurrency} />} />
                            </Routes>
                        </div>
                        <Footer />
                    </div>
                </HashRouter>
            );
        };

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (error) {
            console.error('Error rendering React app:', error);
            document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 50px;"><h1>Error Loading Marketplace</h1><p>Please check the console for details and ensure all scripts loaded correctly.</p></div>';
        }
    </script>
</body>
</html>
