<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua Luxury Store - My Wishlist</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./responsive.css" />
    <style>
        body { font-family: serif; }
        .logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            object-position: center;
            display: block;
            background: transparent;
            border-radius: 50%;
            padding: 4px;
        }
        @media (max-width: 768px) {
            .logo img { width: 65px; height: 65px; }
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const parsePrice = (price) => {
            if (typeof price === 'number') return price;
            return Number(String(price).replace(/[^0-9.]/g, '')) || 0;
        };

        const formatPrice = (value) => '₦' + value.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

        const getWishlist = (email) => {
            const stored = localStorage.getItem(`jmpWishlist_${email}`);
            return stored ? JSON.parse(stored) : [];
        };

        const saveWishlist = (email, favorites) => {
            localStorage.setItem(`jmpWishlist_${email}`, JSON.stringify(favorites));
        };

        const getCart = (email) => {
            const stored = localStorage.getItem(`jmpCart_${email}`);
            return stored ? JSON.parse(stored) : [];
        };

        const saveCart = (email, cart) => {
            localStorage.setItem(`jmpCart_${email}`, JSON.stringify(cart));
        };

        const Favorites = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const user = localStorage.getItem('jmpCurrentUser');
                if (user) {
                    const userData = JSON.parse(user);
                    setCurrentUser(userData);
                    setFavorites(getWishlist(userData.email));
                }
                setLoading(false);
            }, []);

            const removeFromFavorites = (productId) => {
                const newFavorites = favorites.filter(fav => fav.id !== productId);
                setFavorites(newFavorites);
                if (currentUser) {
                    saveWishlist(currentUser.email, newFavorites);
                }
            };

            const addToCart = (product) => {
                if (product.userEmail === currentUser.email) {
                    alert('You cannot add your own product to cart.');
                    return;
                }
                const cart = getCart(currentUser.email);
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    alert('Product already in cart.');
                    return;
                }
                const newCart = [...cart, { ...product, quantity: 1 }];
                saveCart(currentUser.email, newCart);
                alert('Added to cart!');
            };

            if (loading) return <div className="text-center pt-20">Loading...</div>;

            return (
                <div className="min-h-screen bg-[#0b0b0b] text-white">
                    {/* Header */}
                    <header className="bg-[#111111] border-b border-[#D4AF37] px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex flex-col items-center logo">
                                <img src="image/my-logo.png" alt="Joshua Luxury Store Logo" />
                                <div className="text-sm font-bold text-[#D4AF37]">Joshua Luxury Store</div>
                            </div>
                            <button
                                onClick={() => window.location.href = './marketplace.html'}
                                className="border border-[#D4AF37] text-[#D4AF37] px-4 py-2 rounded-full hover:bg-[#D4AF37] hover:text-black transition-colors"
                            >
                                Back to Marketplace
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className="max-w-7xl mx-auto px-6 py-10">
                        <h1 className="text-4xl md:text-5xl font-bold text-[#D4AF37] mb-2">⭐ My Wishlist</h1>
                        <p className="text-gray-300 mb-8">{favorites.length} item{favorites.length !== 1 ? 's' : ''} in your wishlist</p>

                        {favorites.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {favorites.map((product) => {
                                    const isOwner = product.userEmail === currentUser.email;
                                    const isPaused = product.paused;
                                    return (
                                        <div key={product.id} className="rounded-3xl overflow-hidden border border-[#D4AF37] bg-[#111111] shadow-xl"
                                            onTouchStart={(e) => { e.currentTarget.dataset.startX = e.touches[0].clientX; }}
                                            onTouchEnd={(e) => {
                                                const startX = parseFloat(e.currentTarget.dataset.startX || 0);
                                                const endX = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : 0;
                                                const delta = endX - startX;
                                                if (delta > 80) {
                                                    // swipe right -> remove from wishlist
                                                    removeFromFavorites(product.id);
                                                } else if (delta < -80) {
                                                    // swipe left -> add to cart
                                                    addToCart(product);
                                                }
                                            }}
                                            onPointerDown={(e) => { e.currentTarget.dataset.startX = e.clientX; }}
                                            onPointerUp={(e) => {
                                                const startX = parseFloat(e.currentTarget.dataset.startX || 0);
                                                const endX = e.clientX || 0;
                                                const delta = endX - startX;
                                                if (delta > 80) {
                                                    removeFromFavorites(product.id);
                                                } else if (delta < -80) {
                                                    addToCart(product);
                                                }
                                            }}
                                        >
                                            <div className="h-48 bg-gray-800 flex items-center justify-center relative">
                                                {product.images && product.images.length > 0 ? (
                                                    <img src={product.images[0]} alt={product.title} className="w-full h-full object-cover" />
                                                ) : (
                                                    <span className="text-6xl">📦</span>
                                                )}
                                                <button
                                                    onClick={() => removeFromFavorites(product.id)}
                                                    className="absolute top-2 right-2 w-10 h-10 bg-red-500 rounded-full flex items-center justify-center hover:bg-opacity-80 text-lg font-bold"
                                                >
                                                    ❌
                                                </button>
                                                {isPaused && (
                                                    <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                                                        <span className="text-white text-lg font-bold">Currently Unavailable</span>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="p-6">
                                                <h3 className="text-xl font-bold text-white mb-2">{product.title}</h3>
                                                <p className="text-gray-300 text-sm mb-4">{product.description}</p>
                                                <p className="text-2xl font-bold text-[#D4AF37] mb-4">
                                                    {formatPrice(Math.round(parsePrice(product.price) * 1.1))}
                                                </p>
                                                <div className="flex gap-2">
                                                    {isOwner ? (
                                                        <button
                                                            disabled
                                                            className="flex-1 bg-gray-600 text-gray-400 py-2 rounded-full font-semibold cursor-not-allowed"
                                                        >
                                                            Your Product
                                                        </button>
                                                    ) : (
                                                        <button
                                                            onClick={() => addToCart(product)}
                                                            disabled={isPaused}
                                                            className={`flex-1 py-2 rounded-full font-semibold transition-colors ${isPaused ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-[#D4AF37] text-black hover:bg-opacity-80'}`}
                                                        >
                                                            🛒 Add to Cart
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="text-center py-20 bg-[#111111] border border-[#D4AF37] rounded-3xl">
                                <p className="text-gray-300 text-2xl mb-8">No items in your wishlist yet</p>
                                <button
                                    onClick={() => window.location.href = './marketplace.html'}
                                    className="bg-[#D4AF37] text-black px-8 py-4 rounded-full font-bold text-lg hover:bg-opacity-80 transition-colors"
                                >
                                    Browse Products
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<Favorites />, document.getElementById('root'));
    </script>
</body>
</html>
