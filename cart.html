<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua Luxury Store - Shopping Cart</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: serif; }
        .logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            object-position: center;
            display: block;
            background: transparent;
            border-radius: 50%;
            padding: 4px;
        }
        @media (max-width: 768px) {
            .logo img { width: 65px; height: 65px; }
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const parsePrice = (price) => {
            if (typeof price === 'number') return price;
            return Number(String(price).replace(/[^0-9.]/g, '')) || 0;
        };

        const formatPrice = (value) => '₦' + value.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

        const getCart = (email) => {
            const stored = localStorage.getItem(`jmpCart_${email}`);
            return stored ? JSON.parse(stored) : [];
        };

        const saveCart = (email, cart) => {
            localStorage.setItem(`jmpCart_${email}`, JSON.stringify(cart));
        };

        // Wishlist helpers
        const getWishlist = (email) => {
            const stored = localStorage.getItem(`jmpWishlist_${email}`);
            return stored ? JSON.parse(stored) : [];
        };

        const saveWishlist = (email, wishlist) => {
            localStorage.setItem(`jmpWishlist_${email}`, JSON.stringify(wishlist));
        };

        const Cart = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [cart, setCart] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const user = localStorage.getItem('jmpCurrentUser');
                if (user) {
                    const userData = JSON.parse(user);
                    setCurrentUser(userData);
                    setCart(getCart(userData.email));
                }
                setLoading(false);
            }, []);

            const removeFromCart = (productId) => {
                const newCart = cart.filter(item => item.id !== productId);
                setCart(newCart);
                if (currentUser) {
                    saveCart(currentUser.email, newCart);
                }
            };

            const addToWishlist = (product) => {
                if (!currentUser) {
                    alert('Please login to add to wishlist.');
                    window.location.href = './index.html#/login';
                    return;
                }
                const wishlist = getWishlist(currentUser.email);
                const exists = wishlist.some(w => w.id === product.id);
                if (exists) {
                    alert('Product already in wishlist');
                    return;
                }
                const newWishlist = [...wishlist, product];
                saveWishlist(currentUser.email, newWishlist);

                // Also remove from cart
                const newCart = cart.filter(item => item.id !== product.id);
                setCart(newCart);
                saveCart(currentUser.email, newCart);

                alert('Added to wishlist and removed from cart');
            };

            const updateQuantity = (productId, quantity) => {
                if (quantity < 1) {
                    removeFromCart(productId);
                    return;
                }
                const newCart = cart.map(item => 
                    item.id === productId ? { ...item, quantity } : item
                );
                setCart(newCart);
                if (currentUser) {
                    saveCart(currentUser.email, newCart);
                }
            };

            const DELIVERY_FEE_PER_ITEM = 500;

            const subtotal = cart.reduce((sum, item) => {
                const qty = item.quantity || 1;
                return sum + parsePrice(item.price) * 1.1 * qty;
            }, 0);

            const totalDelivery = cart.reduce((sum, item) => {
                const qty = item.quantity || 1;
                return sum + DELIVERY_FEE_PER_ITEM * qty;
            }, 0);

            const total = subtotal + totalDelivery;

            const generateOrderId = () => {
                const randomDigits = Math.floor(1000000 + Math.random() * 9000000);
                return `JLS${randomDigits}YI`;
            };

            const placeOrder = () => {
                if (cart.length === 0) {
                    alert('Cart is empty.');
                    return;
                }
                const orderId = generateOrderId();
                const newOrder = {
                    id: orderId,
                    buyerEmail: currentUser.email,
                    buyerName: `${currentUser.firstName} ${currentUser.lastName}`,
                    products: cart,
                    subtotal: subtotal,
                    deliveryFee: totalDelivery,
                    totalAmount: total,
                    status: 'Ordered',
                    orderDate: new Date().toISOString(),
                    pickupDate: null
                };

                const stored = localStorage.getItem('jmpOrders');
                const allOrders = stored ? JSON.parse(stored) : [];
                allOrders.push(newOrder);
                localStorage.setItem('jmpOrders', JSON.stringify(allOrders));

                // Send messages to sellers
                const messages = JSON.parse(localStorage.getItem('jmpMessages') || '[]');
                cart.forEach(product => {
                    messages.push({
                        id: Date.now().toString() + Math.random(),
                        recipientEmail: product.userEmail,
                        title: 'New Order Received',
                        content: `New order ${orderId}: "${product.title}" has been placed. Drop the product at New yidi road, yinolu pharmacy, irewolede ilorin kwara state within 24 to 72 hours. Contact: 07070252673 for road direction.`,
                        productImage: product.images && product.images.length > 0 ? product.images[0] : null,
                        productTitle: product.title,
                        productDescription: product.description,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                });
                localStorage.setItem('jmpMessages', JSON.stringify(messages));

                // Clear cart
                setCart([]);
                saveCart(currentUser.email, []);

                alert('Order placed successfully! You will be notified when ready for pickup.');
                window.location.href = './Marketplace.html';
            };

            if (loading) return <div className="text-center pt-20">Loading...</div>;

            return (
                <div className="min-h-screen bg-[#0b0b0b] text-white">
                    {/* Header */}
                    <header className="bg-[#111111] border-b border-[#D4AF37] px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex flex-col items-center logo">
                                <img src="image/my-logo.png" alt="Joshua Luxury Store Logo" />
                                <div className="text-sm font-bold text-[#D4AF37]">Joshua Luxury Store</div>
                            </div>
                            <button
                                onClick={() => window.location.href = './Marketplace.html'}
                                className="border border-[#D4AF37] text-[#D4AF37] px-4 py-2 rounded-full hover:bg-[#D4AF37] hover:text-black transition-colors"
                            >
                                Back to Marketplace
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className="max-w-5xl mx-auto px-6 py-10">
                        <h1 className="text-4xl md:text-5xl font-bold text-[#D4AF37] mb-8">🛒 Shopping Cart</h1>

                        {cart.length > 0 ? (
                            <div className="space-y-8">
                                <div className="space-y-4">
                                    {cart.map((item) => (
                                        <div key={item.id} className="bg-[#111111] border border-[#D4AF37] rounded-3xl p-6 flex gap-6"
                                            onTouchStart={(e) => { e.currentTarget.dataset.startX = e.touches[0].clientX; }}
                                            onTouchEnd={(e) => {
                                                const startX = parseFloat(e.currentTarget.dataset.startX || 0);
                                                const endX = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : 0;
                                                const delta = endX - startX;
                                                if (delta < -80) {
                                                    // swipe left -> add to wishlist
                                                    addToWishlist(item);
                                                }
                                            }}
                                            onPointerDown={(e) => { e.currentTarget.dataset.startX = e.clientX; }}
                                            onPointerUp={(e) => {
                                                const startX = parseFloat(e.currentTarget.dataset.startX || 0);
                                                const endX = e.clientX || 0;
                                                const delta = endX - startX;
                                                if (delta < -80) {
                                                    addToWishlist(item);
                                                }
                                            }}
                                        >
                                            <div className="w-32 h-32 bg-gray-800 rounded-lg flex items-center justify-center flex-shrink-0">
                                                {item.images && item.images.length > 0 ? (
                                                    <img src={item.images[0]} alt={item.title} className="w-full h-full object-cover rounded-lg" />
                                                ) : (
                                                    <span className="text-4xl">📦</span>
                                                )}
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="text-2xl font-bold text-white mb-2">{item.title}</h3>
                                                <p className="text-gray-300 text-sm mb-4">{item.description}</p>
                                                <p className="text-[#D4AF37] font-bold text-lg mb-4">
                                                    {formatPrice(Math.round(parsePrice(item.price) * 1.1))}
                                                </p>
                                                <div className="flex items-center gap-4">
                                                    <label className="text-gray-300">Qty:</label>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        value={item.quantity || 1}
                                                        onChange={(e) => updateQuantity(item.id, parseInt(e.target.value) || 1)}
                                                        className="w-16 bg-[#222] border border-[#D4AF37] text-white px-2 py-1 rounded"
                                                    />
                                                </div>
                                            </div>
                                            <div className="flex flex-col gap-2">
                                                <button
                                                    onClick={() => removeFromCart(item.id)}
                                                    className="text-red-500 hover:text-red-400 px-4 py-2 rounded font-semibold h-fit"
                                                >
                                                    ❌ Remove
                                                </button>
                                                <button
                                                    onClick={() => addToWishlist(item)}
                                                    className="text-[#D4AF37] hover:text-yellow-400 px-4 py-2 rounded font-semibold h-fit"
                                                >
                                                    🤍 Add to Wishlist
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Total and Place Order */}
                                <div className="bg-[#111111] border border-[#D4AF37] rounded-3xl p-8 space-y-6">
                                    <div className="border-t border-[#D4AF37] pt-6">
                                                                <div className="flex flex-col gap-3 mb-8">
                                            <div className="flex justify-between items-center">
                                                <span className="text-lg text-gray-300">Subtotal:</span>
                                                <span className="text-lg font-semibold text-white">{formatPrice(Math.round(subtotal))}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-lg text-gray-300">Delivery fee ({formatPrice(DELIVERY_FEE_PER_ITEM)} x {cart.reduce((s,i)=> s + (i.quantity||1),0)}):</span>
                                                <span className="text-lg font-semibold text-white">{formatPrice(Math.round(totalDelivery))}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-3xl font-bold text-white">Total:</span>
                                                <span className="text-4xl font-bold text-[#D4AF37]">{formatPrice(Math.round(total))}</span>
                                            </div>
                                        </div>
                                        <button
                                            onClick={placeOrder}
                                            className="w-full bg-[#D4AF37] text-black py-4 rounded-3xl font-bold text-lg hover:bg-opacity-80 transition-colors"
                                        >
                                            Place Order
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-20 bg-[#111111] border border-[#D4AF37] rounded-3xl">
                                <p className="text-gray-300 text-2xl mb-8">Your cart is empty</p>
                                <button
                                    onClick={() => window.location.href = './Marketplace.html'}
                                    className="bg-[#D4AF37] text-black px-8 py-4 rounded-full font-bold text-lg hover:bg-opacity-80 transition-colors"
                                >
                                    Start Shopping
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<Cart />, document.getElementById('root'));
    </script>
</body>
</html>
